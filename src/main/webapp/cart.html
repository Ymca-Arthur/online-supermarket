<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Your Cart</h1>
    <a href="products.html">Back to store</a>
    <div id="cart_list"></div>
    <form action="/app-1.0-SNAPSHOT/buy" method="post">
        <button type="submit">Buy</button>
    </form>
        <script>
        fetch('/app-1.0-SNAPSHOT/cart')
        .then(response => response.json())
        .then(data => {
            let html = '<ul>';
            data.forEach(item => {
                html += `<li>${item.name} - $${item.price} x ${item.quantity}</li>`;
            });
            html += '</ul>';
            document.getElementById('cart_list').innerHTML = html;
        });
    </script>
</body>
</html>
