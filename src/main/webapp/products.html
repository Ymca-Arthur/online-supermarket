<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Supermarket</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Online Supermarket</h1>
    <div>
        <a href="index.html">Back to login</a>
        <a href="cart.html">Cart</a>
        
    </div>
      <div id="products"></div>

    <p>copyright 2026 do not distribute</p>
    
    <script>
        fetch('/app-1.0-SNAPSHOT/products')
        .then(response => response.json())
        .then(data => {
    let html = '<ul>';
    data.forEach(product => {
               html += `<li>${product.name} - $${product.price} (${product.stock} in stock)
            <form action="/app-1.0-SNAPSHOT/cart" method="post">
                <input type="hidden" name="product_id" value="${product.id}">
                ${product.stock > 0 ? '<button type="submit">Add to cart</button>' : 'Out of stock'}
            </form></li>`;
    });
    html += '</ul>';
    document.getElementById('products').innerHTML = html;
});
    </script>
</body>
</html>
